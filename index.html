<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }
        header {
            background: #333;
            color: #fff;
            padding: 15px;
            text-align: center;
        }
        nav {
            background: #444;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }
        .section {
            padding: 20px;
            max-width: 800px;
            margin: auto;
            background: #fff;
            border-radius: 8px;
            margin-top: 20px;
        }
        h2 { color: #333; }
        footer {
            text-align: center;
            padding: 15px;
            margin-top: 20px;
            background: #333;
            color: #fff;
        }
        form input, form textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Portfolio</h1>
    </header>

    <nav>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="about" class="section">
        <h2>About Me</h2>
        <p>Hello! I am a web developer learning HTML, CSS, and JavaScript. This is my simple portfolio website.</p>
    </section>

    <section id="projects" class="section">
        <h2>Projects</h2>
        <ul>
            <li>✔ Portfolio Website</li>
            <li>✔ Weather App</li>
            <li>✔ Calculator App</li>
        </ul>
    </section>

    <section id="contact" class="section">
        <h2>Contact Me</h2>
        <form>
            <input type="text" placeholder="Your Name" required />
            <input type="email" placeholder="Your Email" required />
            <textarea placeholder="Your Message" rows="5" required></textarea>
            <button type="submit">Send</button>
        </form>
    </section>

    <footer>
        © 2025 My Portfolio
    </footer>
</body>
</html>
